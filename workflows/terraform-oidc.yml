# Terraform Operations using GitHub OIDC (no static AWS keys).
# Requires: IAM role with OIDC trust for your repo; job permissions id-token: write.
# See README for OIDC setup.
name: Terraform Operations (OIDC)

on:
  workflow_call:
    inputs:
      terraform_version:
        required: true
        type: string
        description: "Terraform version to use"
      working_directory:
        required: true
        type: string
        description: "Directory containing Terraform configuration"
      terraform_workspace:
        required: true
        type: string
        description: "Terraform workspace to use"
      tf_vars_file:
        required: false
        type: string
        description: "Terraform variables file to use"
      backend_config:
        required: false
        type: string
        description: "Terraform backend configuration (written to backend_config.hcl)"
      action:
        required: true
        type: string
        description: "Action to perform: validate, plan, or apply"
      post_plan_comment:
        required: false
        type: boolean
        default: true
        description: "Post plan output as PR comment when action is plan (requires GITHUB_TOKEN)"
    secrets:
      AWS_ROLE_ARN:
        required: true
        description: "ARN of IAM role to assume via OIDC"
      TF_VAR_app_name:
        required: true
      TF_VAR_environment:
        required: true
      TF_VAR_aws_region:
        required: true
      GITHUB_TOKEN:
        required: false
        description: "Optional; pass to post plan output as PR comment"

jobs:
  terraform:
    name: Terraform (OIDC)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.TF_VAR_aws_region }}

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check
      continue-on-error: true

    - name: Write backend config
      if: ${{ inputs.backend_config != '' }}
      env:
        BACKEND_CONFIG: ${{ inputs.backend_config }}
      run: |
        printf '%s\n' "$BACKEND_CONFIG" > backend_config.hcl

    - name: Terraform Init
      id: init
      run: |
        if [ -f backend_config.hcl ]; then
          terraform init -backend-config=backend_config.hcl -reconfigure
        else
          terraform init -reconfigure
        fi

    - name: Terraform Validate
      id: validate
      run: terraform validate

    - name: Terraform Security Scan
      id: tfsec
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        working_directory: ${{ inputs.working_directory }}
      continue-on-error: true

    - name: Terraform Plan
      id: plan
      if: ${{ inputs.action == 'plan' || inputs.action == 'apply' }}
      run: |
        if [ -n "${{ inputs.tf_vars_file }}" ] && [ -f "${{ inputs.tf_vars_file }}" ]; then
          terraform plan -var-file="${{ inputs.tf_vars_file }}" -no-color -out=tfplan 2>&1 | tee plan_output.txt
        else
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        fi
      continue-on-error: true

    - name: Comment Plan on PR
      if: ${{ inputs.action == 'plan' && inputs.post_plan_comment && github.event_name == 'pull_request' && secrets.GITHUB_TOKEN != '' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const workingDir = '${{ inputs.working_directory }}' || '.';
          const planPath = path.join(process.cwd(), workingDir, 'plan_output.txt');
          let planOutput = '';
          try {
            planOutput = fs.readFileSync(planPath, 'utf8');
          } catch (e) {
            planOutput = '(Plan output not found.)';
          }
          const body = `#### Terraform Plan 📖 (OIDC)
          <details><summary>Show Plan</summary>

          \`\`\`hcl
          ${planOutput.replace(/```/g, '`')}
          \`\`\`

          </details>

          *Pushed by: @${{ github.actor }}, Workflow: \`${{ github.workflow }}\`*`;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Terraform Apply
      if: ${{ inputs.action == 'apply' }}
      run: terraform apply -auto-approve tfplan
